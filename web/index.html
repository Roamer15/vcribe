    <script>
      window.onerror = function (msg, src, line, col) {
        var info =
          msg +
          "\n\nFile: " +
          src +
          "\nLine: " +
          line +
          ":" +
          col +
          "\n\nBrowser: " +
          navigator.userAgent;
        document.body.innerHTML =
          '<pre style="color:#fff;background:#000;font-size:28px;padding:40px;white-space:pre-wrap;margin:0">' +
          info +
          "</pre>";
      };
    </script>
