<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.onerror = function (msg, src, line, col) {
        var info =
          msg +
          "\n\nFile: " +
          src +
          "\nLine: " +
          line +
          ":" +
          col +
          "\n\nBrowser: " +
          navigator.userAgent;
        document.body.innerHTML =
          '<pre style="color:#fff;background:#000;font-size:28px;padding:40px;white-space:pre-wrap;margin:0">' +
          info +
          "</pre>";
      };
    </script>
    <title>Vcribe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
